lang: es

project:
  type: website
  output-dir: _site

website:
  title: "Catálogo Editorial | SCR- UNGRD"
  site-url: https://scr-ungrd.github.io/catalogo-publicaciones
  favicon: images/favicon.png
  open-graph:
    title: "Catálogo Editorial · Subdirección para el Conocimiento del Riesgo"
    description: >
      Catálogo de publicaciones, guías, informes y materiales de divulgación
      elaborados por la Subdirección para el Conocimiento del Riesgo, UNGRD.

  # Buscador como campo de texto en la barra (igual que Cuadernos Reproducibles y el HUB)
  search:
    type: textbox

  # Barra de navegación institucional (modelo: Cuadernos Reproducibles):
  # firma UNGRD en blanco | nombre del proyecto en dos líneas, secciones, íconos, buscador y tema.
  navbar:
    logo: images/logo-ungrd-blanco.svg
    logo-alt: "UNGRD - Unidad Nacional para la Gestión del Riesgo de Desastres"
    title: "Catálogo Editorial|SCR-UNGRD"
    background: "#213362"
    foreground: "#ffffff"
    pinned: true
    left:
      - text: "Catálogo"
        href: index.qmd#catalogo
      - text: "Acerca de"
        href: acerca-de.qmd
    right:
      - icon: diagram-3-fill
        href: "https://scr-ungrd.github.io/hub/"
        aria-label: "HUB SCR — portal de proyectos"
        target: _blank
        rel: noopener noreferrer
      - icon: github
        href: https://github.com/scr-ungrd/catalogo-publicaciones
        aria-label: "Repositorio en GitHub"
        target: _blank
        rel: noopener noreferrer
      - icon: translate
        href: "https://translate.google.com/translate?sl=es&tl=en&u=https://scr-ungrd.github.io/catalogo-publicaciones/"
        aria-label: "Translate to English"
        target: _blank
        rel: noopener noreferrer

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    toc: false
    anchor-sections: false
    smooth-scroll: true
    page-layout: full
    include-after-body: _footer.html
